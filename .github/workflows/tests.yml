name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the Quantum DOS Explorer dependency
        # thermoelectric-explorer consumes the density of states produced
        # by quantum-dos-explorer, which is not published on PyPI. Install
        # it from its repository so the dependency resolves. Replace the
        # URL with the actual location of your quantum-dos-explorer repo.
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/REPLACE_ME/quantum-dos-explorer"

      - name: Install this package with test extras
        run: pip install -e ".[dev]"

      - name: Run the test suite with coverage
        run: pytest --cov=thermoelectric --cov-report=term-missing
